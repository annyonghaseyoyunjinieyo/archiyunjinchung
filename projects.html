<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Yunjin Chung</title>
  <meta name="description" content="Chung Yunjin の建築作品集：Inside Out、直線を重ね、芸術に触れる、夢のゆりかご、Secret.、一年生の時。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/sub.css?v=2">
  <style>
    /* bookshelf of projects — hover a spine to open it, click to enter */
    .shelf {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 500px;
      padding: 0 24px;
      border-bottom: 10px solid var(--ink);
    }
    .spine {
      position: relative;
      flex: 0 0 var(--w, 70px);
      height: var(--h, 400px);
      background: var(--c, #fff);
      border: 1.5px solid var(--ink);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 0;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: flex-basis .5s cubic-bezier(.2,.7,.2,1), transform .3s;
    }
    .spine.dark { color: #fff; }
    .spine .no { text-align: center; font-size: 14px; font-weight: 900; }
    .spine .title {
      writing-mode: vertical-rl;
      margin: 0 auto;
      font-family: var(--jp);
      font-weight: 700;
      font-size: 17px;
      letter-spacing: .14em;
      white-space: nowrap;
    }
    .spine .yr { text-align: center; font-size: 9px; letter-spacing: .1em; writing-mode: vertical-rl; margin: 0 auto; }
    .spine .cover {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity .3s .12s;
      display: flex;
      flex-direction: column;
      background: #fff;
      color: var(--ink);
    }
    .spine .cover img { width: 100%; flex: 1; min-height: 0; object-fit: cover; display: block; border-bottom: 1.5px solid var(--ink); }
    .spine .cover div { padding: 16px 20px 18px; }
    .spine .cover small { font-size: 11px; font-weight: 800; letter-spacing: .14em; color: var(--pink-deep); }
    .spine .cover h3 { margin: 4px 0 2px; font-family: var(--jp); font-size: 22px; line-height: 1.3; }
    .spine .cover p { margin: 0; font-family: var(--jp); font-size: 12.5px; color: #666; }
    .spine .cover em { display: block; margin-top: 10px; font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: .12em; }
    .spine:hover, .spine.open { flex-basis: 440px; transform: translateY(-12px); }
    .spine:hover .cover, .spine.open .cover { opacity: 1; }
    .shelf-note { font-size: 12px; color: #777; margin-top: 14px; font-family: var(--jp); }

    /* index list */
    .index { list-style: none; margin: 0; padding: 0; }
    .index a {
      display: grid;
      grid-template-columns: 70px 220px 1fr auto;
      gap: 28px;
      align-items: center;
      padding: 18px 8px;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
      transition: background .2s, padding .2s;
    }
    .index a:hover { background: #fff; padding-left: 18px; }
    .index .n { font-size: 26px; font-weight: 900; }
    .index img { width: 220px; height: 120px; object-fit: cover; border: 1px solid var(--ink); display: block; }
    .index h3 { margin: 0; font-family: var(--jp); font-size: 22px; }
    .index p { margin: 4px 0 0; font-family: var(--jp); font-size: 13px; color: #666; }
    .index .go { font-size: 12px; font-weight: 800; letter-spacing: .12em; padding: 8px 14px; border: 1px solid var(--ink); background: var(--pink-soft); }

    @media (max-width: 760px) {
      /* shelf scrolls sideways; spines are plain links (no hover on phones) */
      .shelf { height: 360px; padding: 0 8px; gap: 6px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; }
      .spine { height: calc(var(--h) * .75); flex-basis: calc(var(--w) * .85); scroll-snap-align: start; }
      .spine:hover { flex-basis: calc(var(--w) * .85); transform: none; }
      .spine:hover .cover { opacity: 0; }
      .spine .title { font-size: 15px; }
      .index a { grid-template-columns: 1fr auto; gap: 10px 14px; padding: 16px 0; }
      .index a:hover { padding-left: 0; }
      .index img { grid-column: 1 / -1; width: 100%; height: auto; aspect-ratio: 16 / 9; order: -1; }
      .index .n { font-size: 22px; grid-column: 1 / -1; }
      .index h3 { font-size: 19px; }
      .index .go { align-self: start; }
    }
  </style>
</head>
<body>
  <nav class="bar">
    <a class="back" href="index.html">← BACK TO SITE</a>
    <div class="floors">
      <a class="on" href="projects.html">03F Projects</a>
      <a href="about.html">02F About</a>
      <a href="skills.html">01F Skills</a>
    </div>
  </nav>

  <header class="head">
    <div class="elevator">03F</div>
    <div>
      <h1>Projects</h1>
      <p>作品集 — 背表紙にカーソルを合わせると開き、クリックで詳細へ。</p>
    </div>
  </header>

  <main class="wrap">
    <div class="shelf" id="shelf"></div>
    <p class="shelf-note">Hover a spine to preview · click (or tap) to see the full project.</p>

    <h2 class="section-title">INDEX <small>作品一覧</small></h2>
    <ol class="index" id="index"></ol>
  </main>

  <footer class="footer">
    <span>© 2026 Yunjin Chung</span>
    <a href="index.html">↑ BACK TO THE BUILDING</a>
  </footer>

  <script src="js/projects-data.js?v=2"></script>
  <script>
    const sizes = [[78, 440], [64, 400], [86, 460], [56, 380], [72, 420]];
    const shelf = document.getElementById('shelf');
    const index = document.getElementById('index');
    PROJECTS.forEach((p, i) => {
      const [w, h] = sizes[i % sizes.length];
      const href = `project.html?id=${p.id}`;
      const cover = `assets/projects/covers/${p.id}.jpg`;

      const el = document.createElement('a');
      el.className = 'spine' + (p.dark ? ' dark' : '');
      el.href = href;
      el.style.cssText = `--c:${p.color};--w:${w}px;--h:${h}px`;
      el.innerHTML = `
        <span class="no">${p.id}</span>
        <span class="title">${p.title}</span>
        <span class="yr">${p.tag}</span>
        <div class="cover">
          <img src="${cover}" alt="${p.title}">
          <div><small>${p.id} — ${p.tag}</small><h3>${p.title}</h3><p>${p.sub}</p><em>VIEW PROJECT →</em></div>
        </div>`;
      shelf.appendChild(el);

      const li = document.createElement('li');
      li.innerHTML = `<a href="${href}">
        <span class="n">${p.id}</span>
        <img src="${cover}" alt="" loading="lazy">
        <div><h3>${p.title}</h3><p>${p.sub}</p></div>
        <span class="go">VIEW →</span></a>`;
      index.appendChild(li);
    });
  </script>
</body>
</html>
